# .sops.yaml - Sops encryption rules
# Generate age keys from SSH host keys:
#   ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub
keys:
  # Replace with your actual age keys
  - &desktop "age1..."  # desktop-pc host key
  - &laptop "age1..."   # laptop-nixos host key
creation_rules:
  - path_regex: secrets\.yaml$
    key_groups:
      - age:
          - *desktop
          - *laptop
